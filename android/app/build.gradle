plugins {
    id 'com.android.application'
}

android {
    namespace 'com.enrique.capytv'
    compileSdk 36

    defaultConfig {
        applicationId 'com.enrique.capytv'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '3.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
