<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>tvcast</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#128250;</text></svg>">
<style>
:root{
  --background:#0b0d10; --surface:#151a20; --surface-high:#1e252d; --line:#2a333d;
  --text:#e9eef4; --muted:#8b98a7; --accent:#4da3ff;
  --danger:#ff6b6b; --success:#3ddc84; --warning:#ffc257;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--background); color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  display:flex; flex-direction:column; overscroll-behavior:none;
}
button,input{font-family:inherit}
button{
  background:var(--surface); color:var(--text); border:1px solid var(--line);
  border-radius:12px; padding:13px 14px; font-size:15px; font-weight:600;
  min-height:50px; cursor:pointer; transition:background .12s,opacity .12s;
}
button:active:not([disabled]){background:var(--surface-high)}
button[disabled]{opacity:.42;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#04121f;flex:1}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=url],input[type=search]{
  width:100%; background:var(--surface); border:1px solid var(--line); border-radius:12px;
  color:var(--text); font-size:16px; padding:14px; min-height:52px; outline:none;
  -webkit-appearance:none; appearance:none;
}
input::placeholder{color:var(--muted)}
input:focus{border-color:var(--accent)}

.view{display:none;flex:1;flex-direction:column;min-height:0}
.view.on{display:flex}

.bar{
  flex:none; display:flex; align-items:center; gap:9px;
  padding:calc(10px + var(--safe-top)) 14px 10px; border-bottom:1px solid var(--line);
}
.brand{font-weight:700;font-size:15px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--success)}
.dot.off{background:var(--warning)}
.tvlabel{
  margin-left:auto; font-size:12px; color:var(--muted); text-align:right;
  min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}

.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.compose{padding:14px}
.row{display:flex;gap:10px;margin-top:10px}
.status{margin:12px 2px 0;font-size:13px;color:var(--muted);min-height:18px;line-height:1.35;overflow-wrap:anywhere}
.status.busy{color:var(--accent)}
.status.good{color:var(--success)}
.status.warn{color:var(--warning)}
.status.bad{color:var(--danger)}

.card{margin:0 14px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.card[hidden]{display:none}
.cardtitle{font-size:16px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.cardmeta{margin-top:4px;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.group{margin-top:13px}
.group[hidden]{display:none}
.grouplabel{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:7px}
.chip{
  background:var(--surface-high); border:1px solid var(--line); color:var(--text);
  border-radius:999px; padding:9px 14px; font-size:14px; min-height:42px;
}
.chip.on{background:var(--accent);border-color:var(--accent);color:#04121f}

.tabs{display:flex;gap:10px;padding:14px;padding-bottom:calc(14px + var(--safe-bottom))}
.tabs button{flex:1;font-size:14px;padding:12px 6px}
.count{color:var(--muted);font-weight:700}

.listhead{
  flex:none; display:flex; align-items:center; gap:10px;
  padding:calc(10px + var(--safe-top)) 14px 10px; border-bottom:1px solid var(--line);
}
.listhead .title{font-weight:700;font-size:15px;flex:1;min-width:0}
.small{min-height:42px;padding:9px 13px;font-size:14px;flex:none}
.searchwrap{flex:none;padding:12px 14px 0}
.searchwrap[hidden]{display:none}
.liststatus{flex:none;margin:10px 16px 0}
.list{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 14px calc(30px + var(--safe-bottom))}
.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.item .body{flex:1;min-width:0}
.item .name{font-size:15px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.item .sub{margin-top:3px;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.empty{padding:28px 4px;color:var(--muted);font-size:14px;text-align:center;line-height:1.5}
.progress{height:5px;border-radius:3px;background:var(--surface-high);overflow:hidden;margin-top:8px}
.progress span{display:block;height:100%;background:var(--accent);transition:width .3s}
.progress.failed span{background:var(--danger)}
</style>
</head>
<body>

<div class="view on" id="homeView">
  <div class="bar">
    <span class="dot" id="televisionDot"></span>
    <span class="brand">tvcast</span>
    <span class="tvlabel" id="televisionLabel">checking the tv</span>
  </div>

  <div class="scroll">
    <div class="compose">
      <input id="linkInput" type="url" inputmode="url" enterkeyhint="send" placeholder="paste a link"
             autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
      <div class="row">
        <button id="sendButton" class="primary">send to tv</button>
        <button id="downloadButton">download</button>
      </div>
      <p class="status" id="statusLine"></p>
    </div>

    <div class="card" id="card" hidden>
      <div class="cardtitle" id="cardTitle"></div>
      <div class="cardmeta" id="cardMeta"></div>
      <div class="group" id="subtitleGroup">
        <div class="grouplabel">subtitles</div>
        <div class="chips" id="subtitleChips"></div>
      </div>
      <div class="group" id="qualityGroup">
        <div class="grouplabel">quality</div>
        <div class="chips" id="qualityChips"></div>
      </div>
    </div>

    <div class="tabs">
      <button data-list="tv">on the tv <span class="count" id="televisionCount"></span></button>
      <button data-list="library">library</button>
      <button data-list="downloads">downloads</button>
    </div>
  </div>
</div>

<div class="view" id="listView">
  <div class="listhead">
    <button class="small back" id="backButton">back</button>
    <span class="title" id="listTitle"></span>
    <button class="small" id="listAction" hidden></button>
  </div>
  <div class="searchwrap" id="searchWrap" hidden>
    <input id="searchInput" type="search" placeholder="search the library"
           autocomplete="off" autocapitalize="none" spellcheck="false">
  </div>
  <p class="status liststatus" id="listStatus"></p>
  <div class="list" id="list"></div>
</div>

<script>
(function () {
'use strict';

var EMPTY_STRING = '';
var SUBTITLE_OFF = '';
var FILE_PREFIX = 'file:';
var LIST_TELEVISION = 'tv';
var LIST_LIBRARY = 'library';
var LIST_DOWNLOADS = 'downloads';
var REQUEST_TIMEOUT_MILLISECONDS = 15000;
var SLOW_REQUEST_TIMEOUT_MILLISECONDS = 120000;
var POLL_INTERVAL_MILLISECONDS = 5000;
var SEARCH_DEBOUNCE_MILLISECONDS = 250;
var MILLISECONDS_PER_SECOND = 1000;
var SECONDS_PER_MINUTE = 60;
var SECONDS_PER_HOUR = 3600;
var BYTES_PER_GIGABYTE = 1073741824;
var BYTES_PER_MEGABYTE = 1048576;
var COMPLETE_PERCENT = 100;

var elements = {};
var nodes = document.querySelectorAll('[id]');
for (var index = 0; index < nodes.length; index += 1) {
    elements[nodes[index].id] = nodes[index];
}

var state = {
    offer: null,
    chosenSubtitleId: SUBTITLE_OFF,
    chosenRenditionId: EMPTY_STRING,
    busy: false,
    listKind: EMPTY_STRING,
    listError: EMPTY_STRING,
    searchTerm: EMPTY_STRING,
    catalogue: [],
    library: [],
    libraryTotal: 0,
    downloads: []
};

function createElement(tagName, className, text) {
    var element = document.createElement(tagName);
    if (className !== undefined && className !== EMPTY_STRING) {
        element.className = className;
    }
    if (text !== undefined) {
        element.textContent = text;
    }
    return element;
}

function createButton(className, text, onTap) {
    var button = createElement('button', className, text);
    button.disabled = state.busy;
    button.addEventListener('click', onTap);
    return button;
}

function setStatus(message, tone) {
    var className = tone === undefined ? 'status' : 'status ' + tone;
    elements.statusLine.textContent = message;
    elements.statusLine.className = className;
    elements.listStatus.textContent = message;
    elements.listStatus.className = className + ' liststatus';
}

function formatRuntime(totalSeconds) {
    if (totalSeconds <= 0) {
        return EMPTY_STRING;
    }
    var hours = Math.floor(totalSeconds / SECONDS_PER_HOUR);
    var minutes = Math.floor((totalSeconds % SECONDS_PER_HOUR) / SECONDS_PER_MINUTE);
    if (hours > 0) {
        return hours + ' h ' + minutes + ' min';
    }
    return minutes + ' min';
}

function formatClock(milliseconds) {
    var totalSeconds = Math.floor(milliseconds / MILLISECONDS_PER_SECOND);
    var hours = Math.floor(totalSeconds / SECONDS_PER_HOUR);
    var minutes = Math.floor((totalSeconds % SECONDS_PER_HOUR) / SECONDS_PER_MINUTE);
    var seconds = totalSeconds % SECONDS_PER_MINUTE;
    var padded = function (value) {
        return value < 10 ? '0' + value : String(value);
    };
    if (hours > 0) {
        return hours + ':' + padded(minutes) + ':' + padded(seconds);
    }
    return minutes + ':' + padded(seconds);
}

function formatSize(bytes) {
    if (bytes >= BYTES_PER_GIGABYTE) {
        return (bytes / BYTES_PER_GIGABYTE).toFixed(1) + ' GB';
    }
    return Math.round(bytes / BYTES_PER_MEGABYTE) + ' MB';
}

async function callApi(pathName, options) {
    var settings = options || {};
    var timeout = settings.timeout || REQUEST_TIMEOUT_MILLISECONDS;
    var request = {
        method: settings.method || 'GET',
        signal: AbortSignal.timeout(timeout)
    };
    if (settings.body !== undefined) {
        request.headers = { 'Content-Type': 'application/json' };
        request.body = JSON.stringify(settings.body);
    }
    var response = null;
    try {
        response = await fetch(pathName, request);
    } catch (error) {
        if (error.name === 'TimeoutError') {
            throw new Error('the pc took too long to answer, it may still be working');
        }
        throw new Error('cannot reach the pc, check it is awake and on the same wifi');
    }
    var text = await response.text();
    var payload = null;
    try {
        payload = JSON.parse(text);
    } catch (error) {
        throw new Error('the pc answered with something unreadable (HTTP ' + response.status + ')');
    }
    if (response.ok === false || payload.ok === false) {
        throw new Error(payload.error || ('the pc answered HTTP ' + response.status));
    }
    return payload;
}

function applyBusyState() {
    var buttons = document.querySelectorAll('button');
    for (var buttonIndex = 0; buttonIndex < buttons.length; buttonIndex += 1) {
        var button = buttons[buttonIndex];
        if (button.classList.contains('back') === false) {
            button.disabled = state.busy;
        }
    }
    elements.sendButton.textContent = state.busy ? 'working' : 'send to tv';
}

async function runExclusive(busyMessage, work) {
    if (state.busy) {
        return;
    }
    state.busy = true;
    setStatus(busyMessage, 'busy');
    applyBusyState();
    try {
        await work();
    } catch (error) {
        setStatus(error.message, 'bad');
    } finally {
        state.busy = false;
        applyBusyState();
    }
}

function readLink() {
    var link = elements.linkInput.value.trim();
    if (/^https?:\/\//i.test(link) === false) {
        setStatus('that needs to be a link starting with http', 'bad');
        return EMPTY_STRING;
    }
    return link;
}

function reportDelivery(result) {
    if (result.delivered) {
        setStatus('playing on the tv: ' + result.title, 'good');
    } else {
        setStatus(result.reason + '. it is queued, the tv will pick it up when the app opens', 'warn');
    }
}

async function deliverOffer() {
    var result = await callApi('/api/send', {
        method: 'POST',
        timeout: SLOW_REQUEST_TIMEOUT_MILLISECONDS,
        body: {
            offerId: state.offer.offerId,
            subtitleId: state.chosenSubtitleId,
            renditionId: state.chosenRenditionId
        }
    });
    reportDelivery(result);
    if (result.subtitleOffsetMeasured === false && state.chosenSubtitleId !== SUBTITLE_OFF) {
        setStatus(elements.statusLine.textContent
            + '. checking the subtitle timing against the audio, it self corrects in a few minutes',
            result.delivered ? 'good' : 'warn');
    }
    await loadCatalogue();
}

function sendPastedLink() {
    var link = readLink();
    if (link === EMPTY_STRING) {
        return;
    }
    runExclusive('looking that link up, this takes a moment', async function () {
        var offer = await callApi('/api/resolve', {
            method: 'POST',
            timeout: SLOW_REQUEST_TIMEOUT_MILLISECONDS,
            body: { url: link }
        });
        state.offer = offer;
        state.chosenSubtitleId = offer.subtitles.length > 0 ? offer.subtitles[0].id : SUBTITLE_OFF;
        state.chosenRenditionId = offer.selectedRenditionId || EMPTY_STRING;
        renderCard();
        setStatus('sending ' + offer.title + ' to the tv', 'busy');
        await deliverOffer();
    });
}

function chooseSubtitle(subtitleId) {
    if (state.offer === null || state.chosenSubtitleId === subtitleId) {
        return;
    }
    state.chosenSubtitleId = subtitleId;
    renderCard();
    runExclusive('switching subtitles on the tv', deliverOffer);
}

function chooseRendition(renditionId) {
    if (state.offer === null || state.chosenRenditionId === renditionId) {
        return;
    }
    state.chosenRenditionId = renditionId;
    renderCard();
    runExclusive('switching quality on the tv', deliverOffer);
}

function buildChip(text, isSelected, onTap) {
    return createButton(isSelected ? 'chip on' : 'chip', text, onTap);
}

function renderCard() {
    var offer = state.offer;
    if (offer === null) {
        elements.card.hidden = true;
        return;
    }
    elements.card.hidden = false;
    elements.cardTitle.textContent = offer.title;

    var parts = [];
    if (offer.quality !== EMPTY_STRING) {
        parts.push(offer.quality);
    }
    if (offer.provider !== EMPTY_STRING) {
        parts.push(offer.provider);
    }
    var runtime = formatRuntime(offer.durationSeconds);
    if (runtime !== EMPTY_STRING) {
        parts.push(runtime);
    }
    if (offer.resumeMilliseconds > 0) {
        parts.push('resumes at ' + formatClock(offer.resumeMilliseconds));
    }
    elements.cardMeta.textContent = parts.join(' · ');

    var subtitleChoices = [{ id: SUBTITLE_OFF, language: 'off' }].concat(offer.subtitles);
    var subtitleChips = subtitleChoices.map(function (track) {
        return buildChip(track.language, track.id === state.chosenSubtitleId, function () {
            chooseSubtitle(track.id);
        });
    });
    elements.subtitleChips.replaceChildren.apply(elements.subtitleChips, subtitleChips);

    elements.qualityGroup.hidden = offer.renditions.length < 2;
    var qualityChips = offer.renditions.map(function (rendition) {
        return buildChip(rendition.label, rendition.id === state.chosenRenditionId, function () {
            chooseRendition(rendition.id);
        });
    });
    elements.qualityChips.replaceChildren.apply(elements.qualityChips, qualityChips);
}

function sendExisting(publicationId, title) {
    runExclusive('sending ' + title + ' to the tv', async function () {
        var result = await callApi('/api/send', {
            method: 'POST',
            timeout: SLOW_REQUEST_TIMEOUT_MILLISECONDS,
            body: { publicationId: publicationId }
        });
        reportDelivery(result);
    });
}

function removeItem(publicationId) {
    runExclusive('removing that from the tv list', async function () {
        await callApi('/api/catalogue/' + publicationId, { method: 'DELETE' });
        await loadCatalogue();
        setStatus('removed', 'good');
    });
}

function startDownload() {
    var link = readLink();
    if (link === EMPTY_STRING) {
        return;
    }
    runExclusive('starting the download', async function () {
        await callApi('/api/download', { method: 'POST', body: { url: link } });
        setStatus('downloading, the progress is in the downloads list', 'good');
        await loadDownloads();
    });
}

function rescanLibrary() {
    runExclusive('scanning the library', async function () {
        var result = await callApi('/api/scan', {
            method: 'POST',
            timeout: SLOW_REQUEST_TIMEOUT_MILLISECONDS
        });
        await loadLibrary();
        setStatus(result.count + ' videos in the library', 'good');
    });
}

function isPublished(item) {
    return item.id.indexOf(FILE_PREFIX) !== 0;
}

async function loadCatalogue() {
    var payload = await callApi('/api/catalogue');
    state.catalogue = (payload.items || []).filter(isPublished);
    elements.televisionCount.textContent = state.catalogue.length === 0
        ? EMPTY_STRING
        : String(state.catalogue.length);
    if (state.listKind === LIST_TELEVISION) {
        renderList();
    }
}

async function loadLibrary() {
    var query = state.searchTerm === EMPTY_STRING
        ? EMPTY_STRING
        : '?q=' + encodeURIComponent(state.searchTerm);
    var payload = await callApi('/api/library' + query);
    state.library = payload.items || [];
    state.libraryTotal = payload.total || 0;
    if (state.listKind === LIST_LIBRARY) {
        renderList();
    }
}

async function loadDownloads() {
    var payload = await callApi('/api/downloads');
    state.downloads = payload.jobs || [];
    if (state.listKind === LIST_DOWNLOADS) {
        renderList();
    }
}

async function loadTelevisionStatus() {
    var status = await callApi('/api/tv/status');
    var located = status.address !== EMPTY_STRING;
    elements.televisionDot.className = located ? 'dot on' : 'dot off';
    var label = located ? status.address : 'tv not located yet';
    if (status.hasPending) {
        label = label + ' · 1 waiting';
    }
    elements.televisionLabel.textContent = label;
}

function describePublication(item) {
    var parts = [];
    if (item.quality !== EMPTY_STRING) {
        parts.push(item.quality);
    }
    if (item.provider !== EMPTY_STRING) {
        parts.push(item.provider);
    }
    var chosen = (item.subtitles || []).filter(function (track) {
        return track.id === item.selectedSubtitleId;
    })[0];
    parts.push(chosen === undefined ? 'no subtitles' : chosen.language);
    if (item.subtitleOffsetMilliseconds !== 0) {
        parts.push('subs ' + (item.subtitleOffsetMilliseconds / MILLISECONDS_PER_SECOND).toFixed(1) + ' s');
    }
    return parts.join(' · ');
}

function buildRow(name, detail, actions) {
    var row = createElement('div', 'item');
    var body = createElement('div', 'body');
    body.appendChild(createElement('div', 'name', name));
    if (detail !== EMPTY_STRING) {
        body.appendChild(createElement('div', 'sub', detail));
    }
    row.appendChild(body);
    for (var actionIndex = 0; actionIndex < actions.length; actionIndex += 1) {
        row.appendChild(actions[actionIndex]);
    }
    return row;
}

function renderTelevisionList() {
    if (state.catalogue.length === 0) {
        return [createElement('div', 'empty', 'nothing sent yet, paste a link on the first screen')];
    }
    return state.catalogue.map(function (item) {
        return buildRow(item.title, describePublication(item), [
            createButton('small', 'play', function () {
                sendExisting(item.id, item.title);
            }),
            createButton('small', 'remove', function () {
                removeItem(item.id);
            })
        ]);
    });
}

function renderLibraryList() {
    if (state.library.length === 0) {
        var message = state.searchTerm === EMPTY_STRING
            ? 'the library is empty, try a scan'
            : 'nothing matched that search';
        return [createElement('div', 'empty', message)];
    }
    return state.library.map(function (item) {
        var detail = [item.folder, formatSize(item.sizeBytes)];
        detail.push(item.hasSubtitle ? 'subtitles' : 'no subtitles');
        return buildRow(item.title, detail.join(' · '), [
            createButton('small', 'play', function () {
                sendExisting(FILE_PREFIX + item.id, item.title);
            })
        ]);
    });
}

function renderDownloadsList() {
    if (state.downloads.length === 0) {
        return [createElement('div', 'empty', 'no downloads yet')];
    }
    return state.downloads.slice().reverse().map(function (job) {
        var row = createElement('div', 'item');
        var body = createElement('div', 'body');
        body.appendChild(createElement('div', 'name', job.url));
        var stateText = job.line;
        if (job.failed) {
            stateText = 'failed: ' + job.line;
        } else if (job.done) {
            stateText = 'finished';
        }
        body.appendChild(createElement('div', 'sub', job.percent + '% · ' + stateText));
        var bar = createElement('div', job.failed ? 'progress failed' : 'progress');
        var fill = createElement('span');
        fill.style.width = (job.done && job.failed === false ? COMPLETE_PERCENT : job.percent) + '%';
        bar.appendChild(fill);
        body.appendChild(bar);
        row.appendChild(body);
        return row;
    });
}

function renderList() {
    var children = [];
    if (state.listError !== EMPTY_STRING) {
        children = [createElement('div', 'empty', state.listError)];
    } else if (state.listKind === LIST_TELEVISION) {
        children = renderTelevisionList();
    } else if (state.listKind === LIST_LIBRARY) {
        children = renderLibraryList();
    } else {
        children = renderDownloadsList();
    }
    elements.list.replaceChildren.apply(elements.list, children);
}

async function refreshCurrentList() {
    if (state.busy) {
        return;
    }
    try {
        if (state.listKind === LIST_TELEVISION) {
            await loadCatalogue();
        } else if (state.listKind === LIST_LIBRARY) {
            await loadLibrary();
        } else if (state.listKind === LIST_DOWNLOADS) {
            await loadDownloads();
        }
        state.listError = EMPTY_STRING;
    } catch (error) {
        state.listError = error.message;
    }
    renderList();
}

function openList(kind) {
    state.listKind = kind;
    state.listError = EMPTY_STRING;
    elements.homeView.classList.remove('on');
    elements.listView.classList.add('on');
    elements.searchWrap.hidden = kind !== LIST_LIBRARY;
    elements.listAction.hidden = kind !== LIST_LIBRARY;
    elements.listAction.textContent = 'scan';
    if (kind === LIST_TELEVISION) {
        elements.listTitle.textContent = 'on the tv';
    } else if (kind === LIST_LIBRARY) {
        elements.listTitle.textContent = 'library';
    } else {
        elements.listTitle.textContent = 'downloads';
    }
    renderList();
    refreshCurrentList();
}

function closeList() {
    state.listKind = EMPTY_STRING;
    elements.listView.classList.remove('on');
    elements.homeView.classList.add('on');
}

elements.sendButton.addEventListener('click', sendPastedLink);
elements.downloadButton.addEventListener('click', startDownload);
elements.backButton.addEventListener('click', closeList);
elements.listAction.addEventListener('click', rescanLibrary);

elements.linkInput.addEventListener('keydown', function (event) {
    if (event.key === 'Enter') {
        event.preventDefault();
        elements.linkInput.blur();
        sendPastedLink();
    }
});

var tabs = document.querySelectorAll('[data-list]');
for (var tabIndex = 0; tabIndex < tabs.length; tabIndex += 1) {
    tabs[tabIndex].addEventListener('click', function (event) {
        openList(event.currentTarget.getAttribute('data-list'));
    });
}

var searchTimer = 0;
elements.searchInput.addEventListener('input', function () {
    window.clearTimeout(searchTimer);
    searchTimer = window.setTimeout(function () {
        state.searchTerm = elements.searchInput.value.trim();
        refreshCurrentList();
    }, SEARCH_DEBOUNCE_MILLISECONDS);
});

window.setInterval(function () {
    if (document.hidden || state.busy) {
        return;
    }
    loadTelevisionStatus().catch(function () {
        elements.televisionDot.className = 'dot';
        elements.televisionLabel.textContent = 'pc not reachable';
    });
    if (state.listKind === LIST_DOWNLOADS) {
        refreshCurrentList();
    }
}, POLL_INTERVAL_MILLISECONDS);

loadTelevisionStatus().catch(function () {
    elements.televisionDot.className = 'dot';
    elements.televisionLabel.textContent = 'pc not reachable';
});
loadCatalogue().catch(function () {
    return null;
});
}());
</script>
</body>
</html>
